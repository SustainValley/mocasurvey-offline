name: Prepare offline final photo and keyword config

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/offline-final-prep.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply configuration patch
        run: python .github/offline-final-prep.py

      - name: Create 18 stable placeholder photo slots
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re

          assets = Path('public/assets')
          def number(path):
              match = re.search(r'ig-photo-(\d+)\.jpg$', path.name)
              return int(match.group(1)) if match else 9999

          sources = sorted(assets.glob('ig-photo-*.jpg'), key=number)
          if not sources:
              raise SystemExit('No ig-photo placeholder assets found')

          for cafe in range(1, 4):
              out_dir = Path(f'public/offline-feeds/cafe-{cafe:02d}')
              out_dir.mkdir(parents=True, exist_ok=True)
              for post in range(1, 7):
                  slot_index = (cafe - 1) * 6 + (post - 1)
                  src = sources[slot_index % len(sources)]
                  with Image.open(src) as opened:
                      img = ImageOps.exif_transpose(opened).convert('RGB')
                      img = ImageOps.fit(img, (720, 720), method=Image.Resampling.LANCZOS)
                      img.save(out_dir / f'post-{post:02d}.webp', 'WEBP', quality=84, method=6)
          PY

      - name: Build verification
        run: |
          npm ci
          npm run build

      - name: Commit final-ready structure
        run: |
          rm .github/offline-final-prep.py .github/workflows/offline-final-prep.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/offlineConfig.js src/styles.css public/offline-feeds README.md .github/offline-final-prep.py .github/workflows/offline-final-prep.yml
          git commit -m "feat: prepare 45-keyword offline flow for final photo swap"
          git push origin main
