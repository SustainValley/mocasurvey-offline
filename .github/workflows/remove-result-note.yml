name: Remove offline result note

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-result-note.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove result note
        run: python .github/remove-result-note.py

      - name: Build verification
        run: |
          npm ci
          npm run build

      - name: Commit cleanup and remove temp files
        run: |
          rm .github/remove-result-note.py .github/workflows/remove-result-note.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx .github/remove-result-note.py .github/workflows/remove-result-note.yml
          git commit -m "fix: remove offline result answer hint"
          git push origin main
