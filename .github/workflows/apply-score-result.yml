name: Apply offline score result patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-score-result.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply score UI patch
        run: python .github/score-result-patch.py

      - name: Build verification
        run: |
          npm ci
          npm run build

      - name: Commit score result feature and clean temp files
        run: |
          rm .github/score-result-patch.py .github/workflows/apply-score-result.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.jsx src/styles.css .github/score-result-patch.py .github/workflows/apply-score-result.yml
          git commit -m "feat: show offline keyword accuracy result"
          git push origin main
